<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Greedy Coyote</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>Greedy Coyote 𓃦𓃥</h1>

<!-- ========================================== -->
<!-- GAME MENU -->
<!-- ========================================== -->

<div class="panel">

    <h3>World State: Under Construction(will be back soon!)</h3>

    <div id="worldStatePanel">

        <div>
            Chapter:
            <span id="chapterDisplay">0</span>
        </div>

        <div>
            Time:
            <span id="timeDisplay">
                Day
            </span>
        </div>

    </div>

</div>

<!-- ========================================== -->
<!-- WORLD -->
<!-- ========================================== -->

<div class="panel">

    <h2 id="locationLabel">
        Something went wrong...
    </h2>

    <p id="locationDescription">
    </p>

    <div id="locationMeta"></div>

</div>


<!-- ========================================== -->
<!-- LOG -->
<!-- ========================================== -->

<div class="panel">

    <h2>Log</h2>

    <div id="log">
    </div>

</div>
    
    
<!-- ========================================== -->
<!-- TRAVEL -->
<!-- ========================================== -->

<div class="panel">
    <h3>Where next?</h3>
    
    <div id="childLocationButtons">
    </div>
    <div id="connectionButtons">
    </div>
    <button id="parentButton" style="display:none;">
        Back
    </button>

    <h3>What's Here?</h3>
    
    <h2>Challenges</h2>
    <div id="challengeButtons">
    </div>

    <h3>Lootboxes</h3>
    <div id="lootboxButtons">
    </div>
        <div id="lootboxContent">
        Select a lootbox.
    </div>
</div>

<!-- ========================================== -->
<!-- INVENTORY -->
<!-- ========================================== -->

<div class="panel">

    <h2>Inventory</h2>
    <div id="inventoryPanel">
    </div>

</div>
    
<!-- ========================================== -->
<!-- CHARACTER -->
<!-- ========================================== -->

<div class="panel" id="characterPanel">
</div>


<!-- ========================================== -->
<!-- MODULES -->
<!-- ========================================== -->

<script type="module">

import {
    initializeGame
} from "./js/engine.js";

initializeGame();

</script>

</body>
</html>
