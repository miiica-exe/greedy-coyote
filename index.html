<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Greedy Coyote</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>Greedy Coyote 𓃦</h1>

<!-- ========================================== -->
<!-- GAME MENU -->
<!-- ========================================== -->

<div class="panel">

    <h3>World State</h3>

    <div id="worldStatePanel">

        <div>
            Chapter:
            <span id="chapterDisplay">0</span>
        </div>

        <div>
            Time:
            <span id="timeDisplay">
                Day
            </span>
        </div>

    </div>

</div>
<!-- ========================================== -->
<!-- CHARACTER -->
<!-- ========================================== -->

<div class="panel" id="characterPanel">
</div>

<!-- ========================================== -->
<!-- WORLD -->
<!-- ========================================== -->

<div class="panel">

    <h2 id="locationLabel">
        Loading...
    </h2>

    <p id="locationDescription">
    </p>

    <div id="locationMeta"></div>

</div>

<!-- ========================================== -->
<!-- CHILD LOCATIONS -->
<!-- ========================================== -->

<div class="panel">

    <h3>Locations</h3>

    <div id="childLocationButtons">
    </div>

    <button id="parentButton" style="display:none;">
        Back
    </button>

</div>

<!-- ========================================== -->
<!-- CONNECTIONS -->
<!-- ========================================== -->

<div class="panel">

    <h3>Connections</h3>

    <div id="connectionButtons">
    </div>

</div>

<!-- ========================================== -->
<!-- CHALLENGES -->
<!-- ========================================== -->

<div class="panel">

    <h3>Challenges</h3>

    <div id="challengeButtons">
    </div>

</div>

<!-- ========================================== -->
<!-- LOOTBOXES -->
<!-- ========================================== -->

<div class="panel">

    <h3>Lootboxes</h3>

    <div id="lootboxButtons">
    </div>

</div>

<!-- ========================================== -->
<!-- ACTIVE LOOTBOX -->
<!-- ========================================== -->

<div class="panel" id="lootboxPanel">

    <h3>Container</h3>

    <div id="lootboxContent">
        Select a lootbox.
    </div>

</div>

<!-- ========================================== -->
<!-- INVENTORY -->
<!-- ========================================== -->

<div class="panel">

    <h2>Inventory</h2>

    <div id="inventoryPanel">
    </div>

</div>


<!-- ========================================== -->
<!-- LOG -->
<!-- ========================================== -->

<div class="panel">

    <h2>Log</h2>

    <div id="log">
    </div>

</div>

<!-- ========================================== -->
<!-- MODULES -->
<!-- ========================================== -->

<script type="module">

import {
    initializeGame
} from "./js/engine.js";

initializeGame();

</script>

</body>
</html>
