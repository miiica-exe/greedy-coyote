<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Homunculus Explorer</title>

<style>
body{
    background:#222;
    color:#eee;
    font-family:Verdana,sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.panel{
    border:1px solid #666;
    padding:10px;
    margin-bottom:10px;
    background:#2f2f2f;
}

button{
    margin:3px;
    padding:6px 10px;
    cursor:pointer;
}

h1,h2,h3{
    margin-top:0;
}

#log{
    height:220px;
    overflow-y:auto;
    background:#111;
    padding:10px;
}

.success{ color:lightgreen; }
.fail{ color:#ff8888; }
</style>
</head>

<body>

<h1>Homunculus Explorer</h1>

<div class="panel" id="characterPanel"></div>
<div class="panel" id="inventoryPanel"></div>

<div class="panel">
    <h2 id="locationName"></h2>
    <p id="locationDescription"></p>

    <div>
        <h3>Exits</h3>
        <div id="exitButtons"></div>
    </div>

    <div>
        <h3>Places In This Room</h3>
        <div id="locationButtons"></div>
    </div>

    <div>
        <h3>Actions</h3>
        <div id="actionButtons"></div>
    </div>
</div>

<div class="panel">
    <h2>Log</h2>
    <div id="log"></div>
</div>

<script>

//==================================================
// CHARACTER
//==================================================

const player = {
    name: "Coyote",
    stats: {
        pliage: 2,
        tether: -1,
        heft: -2,
        acumen: 1
    },
    inventory: [],
    capacity: 10
};

//==================================================
// ITEMS
//==================================================

const items = {
    smallBone: { name: "Small Bone", weight: 1 },
    bigBone: { name: "Big Bone", weight: 3 },
    materials: { name: "Materials", weight: 2 }
};

//==================================================
// STATE
//==================================================

const checkState = {};

const storage = {
    desk: [],
    shoebox: []
};

//==================================================
// ROOMS
//==================================================

const rooms = {
shop:{
    name:"Shop",
    description:"The Stitcher's workshop.",
    exits:["hall","yard"],
    locations:{
        desk:{
    name:"Stitcher's Desk",
    description:"Covered in tools and scraps.",
    actions:[
        { id:"leaveGift", label:"Leave a gift" }
    ]
},
        shoebox:{
            name:"Shoebox",
            description:"Your personal storage.",
            actions:[
                { id:"storeItem", label:"Store items" }
            ]
        }
    }
},

yard:{
    name:"Yard",
    description:"An overgrown yard outside.",
    exits:["shop","hall","kitchen"],
    searchable:true,
    loot:["materials"]
},

hall:{
    name:"Hall",
    description:"You stand in a great hall. Wooden floors creak underfoot.",
    exits:["shop","yard","stairs","kitchen","foyer"]
},

foyer:{
    name:"Foyer",
    description:"A cozy room with a fireplace.",
    exits:["hall","dining"]
},

dining:{
    name:"Dining Room",
    description:"The room is dark.",
    exits:["foyer","kitchen"],
    searchable:true,
    loot:["smallBone"]
},

kitchen:{
    name:"Kitchen",
    description:"There is a tiny chair and table here.",
    exits:["hall","yard","dining"]
},

stairs:{
    name:"Stairs",
    description:"Where would you like to go?",
    exits:["hall","cellar","lobby"]
},

cellar:{
    name:"Cellar",
    description:"It is too dark to see anything.",
    exits:["stairs"]
},

lobby:{
    name:"Landing",
    description:"The upstairs landing.",
    exits:["stairs","balcony"]
},

balcony:{
    name:"Balcony",
    description:"A small balcony overlooking the yard.",
    exits:["lobby"]
},

roof:{
    name:"Roof",
    description:"You balance atop the roof.",
    exits:["balcony"]
},

stitcherRoom:{
    name:"Stitcher's Room",
    description:"This location is locked.",
    exits:["roof"]
}
};

//==================================================

let currentLocation = "shop";
let currentSubLocation = null;

//==================================================

function log(message, css=""){
    const div=document.createElement("div");
    if(css) div.className=css;
    div.innerHTML=message;
    document.getElementById("log").prepend(div);
}

//==================================================

function inventoryWeight(){
    let total=0;
    player.inventory.forEach(item=>{
        total += items[item].weight;
    });
    return total;
}

//==================================================

function addItem(itemId){
    const item=items[itemId];

    if(inventoryWeight()+item.weight > player.capacity){
        log("Too heavy to carry.", "fail");
        return;
    }

    player.inventory.push(itemId);
    updateInventory();
    log(`Added ${item.name}.`, "success");
}

//==================================================

function updateInventory(){
    let html="<h2>Inventory</h2>";
    html+=`Weight: ${inventoryWeight()} / ${player.capacity}<br><br>`;

    if(player.inventory.length===0){
        html+="(empty)";
    } else {
        player.inventory.forEach(i=>{
            html += `${items[i].name}<br>`;
        });
    }
    if(document.querySelector("#takeSelected")){
    openShoebox();
}

    document.getElementById("inventoryPanel").innerHTML=html;
}

//==================================================

function updateCharacter(){
    const s=player.stats;

    document.getElementById("characterPanel").innerHTML=`
        <h2>${player.name}</h2>
        Pliage: ${s.pliage}<br>
        Tether: ${s.tether}<br>
        Heft: ${s.heft}<br>
        Acumen: ${s.acumen}
    `;
}

//==================================================

function moveTo(roomId){
    currentLocation=roomId;
    currentSubLocation=null;
    render();
}

//==================================================

function enterLocation(locationId){
    currentSubLocation=locationId;
    render();
}

//==================================================

function searchContext(){
    const room = rooms[currentLocation];

    if(room.looted){
        log("You've already searched here.");
        return;
    }

    if(room.loot && room.loot.length > 0){
        const itemId = room.loot[0];

        if(confirm(`You found ${items[itemId].name}. Take it?`)){
            addItem(itemId);
            room.looted = true;
        }
    } else {
        log("You search around but find nothing.");
    }
}

//==================================================

function doLocationAction(actionId){
    if(actionId === "leaveGift"){
        storage.desk.push(...player.inventory);
        player.inventory = [];
        updateInventory();
        log("You leave everything at the desk.", "success");
        return;
    }

    if(actionId === "storeItem"){
        openShoebox();
        return;
    }
}

//==================================================

function render(){

    const room = rooms[currentLocation];

    let displayName = room.name;
    let displayDescription = room.description;

    if(currentSubLocation){
        const loc = room.locations[currentSubLocation];
        displayName = loc.name;
        displayDescription = loc.description;
    }

    document.getElementById("locationName").textContent = displayName;
    document.getElementById("locationDescription").textContent = displayDescription;

    //==================================================
    // ROOM BUTTONS (UNCHANGED FUNCTIONALITY)
    //==================================================
    const exits=document.getElementById("exitButtons");
    exits.innerHTML="";

    (room.exits || []).forEach(exit=>{
        const btn=document.createElement("button");
        btn.textContent=rooms[exit].name;
        btn.onclick=()=>moveTo(exit);
        exits.appendChild(btn);
    });

    //==================================================
    // LOCATION BUTTONS (FIXED)
    //==================================================
    const locs=document.getElementById("locationButtons");
    locs.innerHTML="";

    if(!currentSubLocation){
        Object.entries(room.locations || {}).forEach(([id, loc])=>{
            const btn=document.createElement("button");
            btn.textContent = loc.name;   // FIXED BUG HERE
            btn.onclick = () => enterLocation(id);
            locs.appendChild(btn);
        });
    }

    //==================================================
    // ACTION BUTTONS
    //==================================================
    const actions=document.getElementById("actionButtons");
    actions.innerHTML="";

    // GLOBAL SEARCH (always available)
    const searchBtn=document.createElement("button");
    searchBtn.textContent="Search";
    searchBtn.onclick=searchContext;
    actions.appendChild(searchBtn);

    if(currentSubLocation){
        const loc = room.locations[currentSubLocation];

        (loc.actions || []).forEach(action=>{
            const btn=document.createElement("button");
            btn.textContent = action.label;
            btn.onclick = () => doLocationAction(action.id);
            actions.appendChild(btn);
        });

        const back=document.createElement("button");
        back.textContent="Back";
        back.onclick=()=>{ currentSubLocation=null; render(); };
        actions.appendChild(back);
    }
}

    //==================================================
    // SHOEBOX
    //==================================================

function openShoebox(){
    const box = storage.shoebox;

    let html = "<h2>Shoebox Storage</h2>";

    html += "<h3>Take Items</h3>";

    if(box.length === 0){
        html += "(empty)<br><br>";
    } else {
        box.forEach((itemId, index)=>{
            html += `
                <label>
                    <input type="checkbox" data-type="take" data-index="${index}">
                    ${items[itemId].name}
                </label><br>
            `;
        });
    }

    html += `<br><button id="takeSelected">Take Selected</button>`;

//========================================================

    html += "<hr><h3>Deposit Items</h3>";

    if(player.inventory.length === 0){
        html += "(nothing to deposit)<br><br>";
    } else {
        player.inventory.forEach((itemId, index)=>{
            html += `
                <label>
                    <input type="checkbox" data-type="deposit" data-index="${index}">
                    ${items[itemId].name}
                </label><br>
            `;
        });
    }

    html += `<br><button id="depositSelected">Deposit Selected</button>`;
    html += `<button id="closeBox">Close</button>`;

    document.getElementById("inventoryPanel").innerHTML = html;

    document.getElementById("takeSelected").onclick = takeFromShoebox;
    document.getElementById("depositSelected").onclick = depositToShoebox;
    document.getElementById("closeBox").onclick = () => {
        updateInventory();
    };
}
//==================================================
function depositToShoebox(){
    const checkboxes = document.querySelectorAll("#inventoryPanel input[data-type='deposit']");

    const toMove = [];

    checkboxes.forEach(cb=>{
        if(cb.checked){
            toMove.push(parseInt(cb.dataset.index));
        }
    });

    // sort descending so removal doesn't break indexes
    toMove.sort((a,b)=>b-a);

    for(const i of toMove){
        const itemId = player.inventory[i];

        storage.shoebox.push(itemId);
        player.inventory.splice(i, 1);

        log(`Stored ${items[itemId].name}.`, "success");
    }

    updateInventory();
    openShoebox();
}
//===========================================================

function takeFromShoebox(){
    const checkboxes = document.querySelectorAll("#inventoryPanel input[data-type='take']");

    const toTake = [];

    checkboxes.forEach(cb=>{
        if(cb.checked){
            toTake.push(parseInt(cb.dataset.index));
        }
    });

    // sort descending so splice doesn't break indexes
    toTake.sort((a,b)=>b-a);

    for(const i of toTake){
        const itemId = storage.shoebox[i];

        const item = items[itemId];
        if(inventoryWeight() + item.weight <= player.capacity){
            player.inventory.push(itemId);
            storage.shoebox.splice(i, 1);
            log(`Took ${item.name}.`, "success");
        } else {
            log(`${item.name} is too heavy to take.`, "fail");
        }
    }

    updateInventory();
    openShoebox();
}

//==================================================
updateCharacter();
updateInventory();
render();
log("You awaken in the Shop.");

</script>

</body>
</html>
